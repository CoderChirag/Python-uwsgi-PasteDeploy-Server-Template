[uwsgi]
virtualenv = .venv
add-header = Connection: close
buffer-size = 65535
die-on-term = true
enable-threads = true
exit-on-reload = false
harakiri = 300
harakiri-graceful-timeout = 120
harakiri-verbose = true
hook-master-start = unix_signal:15 gracefully_kill_them_all
http-socket = 0.0.0.0:9696
lazy-apps = true
listen = 1024
log-x-forwarded-for = true
master = true
max-requests = 5000
no-orphans = true
paste-logger = true
plugins = python3
processes = 1
procname-prefix-spaced = neutron-api:
route-user-agent = ^kube-probe.* donotlog:
start-time = %t
threads = 4
thunder-lock = true
worker-reload-mercy = 80
wsgi-file = .venv/bin/app