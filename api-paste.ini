[DEFAULT]
global_config_key = global_config_value
with_auth = true

[composite:main]
use = egg:Paste#urlmap
/static = static
/v2 = v2_app

[app:static]
use = egg:Paste#static
document_root = %(here)s/static

[composite:v2_app]
auth = auth v2_api_app
noauth = v2_api_app
use = call:app.pipeline:pipeline_factory

[app:v2_api_app]
local_config_key = local_config_value
paste.app_factory = app.api.v2.app:v2_factory

[filter:auth]
pwd = 123
paste.filter_factory = app.auth:auth_filter_factory